<script>
(function () {
  var CONFIG = {responsive: true, displaylogo: false, locale: 'it',
                modeBarButtonsToRemove: ['select2d', 'lasso2d']};
  function disegna(div) {
    var tag = div.querySelector('script[type="application/json"]');
    if (!tag) return;
    var spec = JSON.parse(tag.textContent);
    Plotly.newPlot(div, spec.data, spec.layout, CONFIG);
    tag.remove();
    div.style.height = '';
  }
  var grafici = document.querySelectorAll('.grafico');
  if (!('IntersectionObserver' in window)) {
    grafici.forEach(disegna);
    return;
  }
  var osservatore = new IntersectionObserver(function (voci) {
    voci.forEach(function (voce) {
      if (!voce.isIntersecting) return;
      osservatore.unobserve(voce.target);
      disegna(voce.target);
    });
  }, {rootMargin: '600px 0px'});
  grafici.forEach(function (div) { osservatore.observe(div); });
})();
</script>
